/* ---------- picking, highlight, focus ---------- */
const pickables = []; Object.values(groups).forEach(g => g.traverse(o => { if (o.isMesh) { o.userData.gid = g.userData.id; pickables.push(o); } }));
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let hover = null, goal = null, active = null;
function setGlow(id, on) {
  groups[id]?.traverse(o => { if (o.isMesh && !o.userData.noGlow) [].concat(o.material).forEach(m => { if (m.emissive) { m.emissive.set(on ? 0x5eead4 : 0x000000); m.emissiveIntensity = on ? 0.22 : 0; } }); });
}
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(pickables, false)[0]?.object.userData.gid ?? null;
}
renderer.domElement.addEventListener("pointermove", e => {
  if (e.buttons) return;
  const id = pick(e); if (id === hover) return;
  if (hover && hover !== active) setGlow(hover, false);
  hover = id; if (id) setGlow(id, true);
  renderer.domElement.style.cursor = id ? "pointer" : "grab";
});
let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const id = pick(e); id ? open(id) : close();
});

const panel = document.getElementById("panel"), tabs = document.getElementById("tabs");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function open(id) {
  const it = items[id]; if (active && active !== id) setGlow(active, false);
  active = id; setGlow(id, true);
  panel.innerHTML = `<button class="btn close" aria-label="Close">✕</button><p class="st">${esc(it.status)}</p><h2>${esc(it.title)}</h2><p>${esc(it.desc)}</p><ul class="chips">${it.stack.map(s => `<li>${esc(s)}</li>`).join("")}</ul><div class="links">${it.links.map(([l, u]) => `<a class="btn" href="${u}" target="_blank" rel="noopener noreferrer">${esc(l)} ↗</a>`).join("")}</div>`;
  panel.classList.add("open"); panel.querySelector(".close").onclick = close;
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const [t, c] = it.focus; goal = [new THREE.Vector3(...c), new THREE.Vector3(...t)];
  if (reduce) { camera.position.copy(goal[0]); controls.target.copy(goal[1]); goal = null; }
}
function close() {
  if (active) setGlow(active, false); active = null; panel.classList.remove("open");
  tabs.querySelectorAll("button").forEach(b => b.classList.remove("on"));
  goal = [HOME[0].clone(), HOME[1].clone()];
  if (reduce) { camera.position.copy(goal[0]); controls.target.copy(goal[1]); goal = null; }
}
addEventListener("keydown", e => e.key === "Escape" && close());
Object.entries(items).forEach(([id, it]) => { const b = document.createElement("button"); b.textContent = it.tab; b.dataset.id = id; b.onclick = () => open(id); tabs.append(b); });
controls.addEventListener("start", () => goal = null);

/* ---------- loop ---------- */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 60 : 40; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (goal) {
    const k = 1 - Math.exp(-dt * 4);
    camera.position.lerp(goal[0], k); controls.target.lerp(goal[1], k);
    if (camera.position.distanceTo(goal[0]) < 0.02) goal = null;
  }
  if (!reduce) leds.forEach((l, i) => l.material.emissiveIntensity = 0.3 + 1.3 * (Math.sin(t * 3 + i * 1.7) > 0 ? 1 : 0.1));
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
